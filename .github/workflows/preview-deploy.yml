name: Preview Deploy

# Requires: .vercel/repo.json committed at repo root (NOT in .gitignore),
# generated by `vercel link` in repo/monorepo mode. Each new project = one
# new entry in that file. No app is hardcoded in this workflow.

on:
  pull_request:
    branches: [main]

# Explicit least-privilege permissions for the whole workflow.
# pull-requests: write is needed by the "comment preview URL" step.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, needed for turbo to compare against the base

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sanity check .vercel/repo.json exists and is valid JSON
        run: |
          if [ ! -f .vercel/repo.json ]; then
            echo "::error::.vercel/repo.json not found at repo root. Run 'vercel link' in repo mode and commit the file."
            exit 1
          fi
          if ! jq empty .vercel/repo.json 2>/tmp/jq_err.log; then
            echo "::error::.vercel/repo.json is not valid JSON:"
            cat /tmp/jq_err.log
            exit 1
          fi

      - name: Detect affected apps (turbo query affected ∩ .vercel/repo.json)
        id: detect
        run: |
          set -uo pipefail

          # In a pull_request context, turbo auto-detects the base via
          # GITHUB_BASE_REF, so we don't need to pass --base here.
          set +e
          RESULT=$(pnpm turbo query affected --packages 2>/tmp/turbo_stderr.log)
          TURBO_EXIT=$?
          set -e

          if [ -s /tmp/turbo_stderr.log ]; then
            echo "--- turbo stderr (warnings/errors, does not affect parsing) ---"
            cat /tmp/turbo_stderr.log
            echo "----------------------------------------------------------------"
          fi

          if [ $TURBO_EXIT -ne 0 ]; then
            echo "::error::turbo query affected failed (exit code $TURBO_EXIT), see stderr above"
            exit $TURBO_EXIT
          fi

          # The '?' after each key prevents jq from breaking with exit code 5
          # if the response isn't in the expected shape (e.g. data == null).
          AFFECTED_PATHS=$(echo "$RESULT" | jq -c '[.data.affectedPackages.items[]?.path]')
          echo "Affected packages: $AFFECTED_PATHS"

          # Cross-references affected packages with known Vercel projects in repo.json.
          # Only apps present in BOTH lists make it into the matrix: changed AND linked.
          MATRIX=$(jq -c --argjson affected "$AFFECTED_PATHS" \
            '[.projects[] | select(.directory as $d | ($affected | index($d)) != null)]' \
            .vercel/repo.json)
          echo "Apps to deploy: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}
      # Preview apps are independent of each other — one app's failed preview
      # shouldn't block previews for unrelated apps in the same PR.
      fail-fast: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      APP_DIRECTORY: ${{ matrix.app.directory }}
      APP_NAME: ${{ matrix.app.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The three calls below use --cwd pointing at the app's directory.
      # Vercel CLI resolves org/project automatically by reading
      # .vercel/repo.json at the root — no VERCEL_ORG_ID or VERCEL_PROJECT_ID
      # secrets needed.
      - name: Pull project config (preview environment)
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --cwd "$APP_DIRECTORY"

      - name: Build (via turbo, with remote cache if TURBO_TOKEN is set)
        run: npx vercel build --token="$VERCEL_TOKEN" --cwd "$APP_DIRECTORY"

      - name: Deploy prebuilt (preview)
        id: deploy
        run: |
          URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN" --cwd "$APP_DIRECTORY")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const appName = process.env.APP_NAME;
            const deployOutcome = '${{ steps.deploy.outcome }}';
            const url = '${{ steps.deploy.outputs.url }}';

            // Hidden marker so we can find and update this app's own comment
            // on re-runs instead of piling up a new comment per push.
            const marker = `<!-- preview-deploy-bot:${appName} -->`;

            const body = deployOutcome === 'success'
              ? `${marker}\n🔗 Preview of **${appName}**: ${url}`
              : `${marker}\n⚠️ Preview deploy for **${appName}** failed. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }