name: Production Deploy

# Requires: .vercel/repo.json committed at repo root (NOT in .gitignore),
# generated by `vercel link` in repo/monorepo mode. Each new project = one
# new entry in that file. No app is hardcoded in this workflow.

on:
  push:
    branches: [main]

# Explicit least-privilege permissions for the whole workflow.
# Individual jobs can narrow this further if needed.
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false # never cancel a production deploy mid-flight

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sanity check .vercel/repo.json exists and is valid JSON
        run: |
          if [ ! -f .vercel/repo.json ]; then
            echo "::error::.vercel/repo.json not found at repo root. Run 'vercel link' in repo mode and commit the file."
            exit 1
          fi
          if ! jq empty .vercel/repo.json 2>/tmp/jq_err.log; then
            echo "::error::.vercel/repo.json is not valid JSON:"
            cat /tmp/jq_err.log
            exit 1
          fi

      - name: Detect affected apps (turbo query affected ∩ .vercel/repo.json)
        id: detect
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail

          # On push (not a PR), Turbo has no implicit "base" to compare against,
          # so we use the commit before this push (github.event.before).
          # Two edge cases we guard against:
          #   1) First push on a new branch -> EVENT_BEFORE is the all-zero SHA.
          #   2) Force-push -> EVENT_BEFORE may not be an ancestor of HEAD anymore,
          #      which would make git/turbo compare against the wrong tree.
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "$ZERO_SHA" ]; then
            echo "First push on branch detected, falling back to HEAD^1."
            BASE_REF="HEAD^1"
          elif ! git cat-file -e "$EVENT_BEFORE" 2>/dev/null; then
            echo "::warning::event.before ($EVENT_BEFORE) not found in local history, falling back to HEAD^1."
            BASE_REF="HEAD^1"
          elif ! git merge-base --is-ancestor "$EVENT_BEFORE" HEAD 2>/dev/null; then
            echo "::warning::event.before ($EVENT_BEFORE) is not an ancestor of HEAD (likely a force-push), falling back to HEAD^1."
            BASE_REF="HEAD^1"
          else
            BASE_REF="$EVENT_BEFORE"
          fi

          echo "Base used for comparison: $BASE_REF"
          echo "HEAD resolved to: $(git rev-parse HEAD)"
          echo "BASE_REF resolved to: $(git rev-parse "$BASE_REF" 2>&1)"

          # stderr goes to a separate file for debugging only — never mixed
          # with $RESULT, since warnings/telemetry there would break jq.
          set +e
          RESULT=$(pnpm turbo query affected --packages --base="$BASE_REF" 2>/tmp/turbo_stderr.log)
          TURBO_EXIT=$?
          set -e

          if [ -s /tmp/turbo_stderr.log ]; then
            echo "--- turbo stderr (warnings/errors, does not affect parsing) ---"
            cat /tmp/turbo_stderr.log
            echo "----------------------------------------------------------------"
          fi

          if [ $TURBO_EXIT -ne 0 ]; then
            echo "::error::turbo query affected failed (exit code $TURBO_EXIT), see stderr above"
            exit $TURBO_EXIT
          fi

          # The '?' after each key prevents jq from breaking with exit code 5
          # if the response isn't in the expected shape (e.g. data == null).
          AFFECTED_PATHS=$(echo "$RESULT" | jq -c '[.data.affectedPackages.items[]?.path]')
          echo "Affected packages since $BASE_REF: $AFFECTED_PATHS"

          MATRIX=$(jq -c --argjson affected "$AFFECTED_PATHS" \
            '[.projects[] | select(.directory as $d | ($affected | index($d)) != null)]' \
            .vercel/repo.json)
          echo "Apps to deploy: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate production deploys behind GitHub Environment protection rules
    # (required reviewers, wait timer, allowed branches — configured in
    # Settings > Environments > production).
    environment: production
    permissions:
      contents: read
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}
      # fail-fast (default: true) intentionally left ON here: combined with
      # max-parallel: 1, a failed app stops the rest of the rollout rather
      # than continuing to deploy other apps after a failure. Change to
      # false if you'd rather deploy every unaffected-by-the-failure app
      # regardless.
      max-parallel: 1 # production deploys one at a time
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: 1
      APP_DIRECTORY: ${{ matrix.app.directory }}
      APP_NAME: ${{ matrix.app.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pull project config (production environment)
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd "$APP_DIRECTORY"

      - name: Production build
        run: npx vercel build --prod --token="$VERCEL_TOKEN" --cwd "$APP_DIRECTORY"

      - name: Deploy prebuilt (production)
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd "$APP_DIRECTORY"