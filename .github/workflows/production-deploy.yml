name: Production Deploy

# Requer: .vercel/repo.json versionado na raiz do repo (não fica no .gitignore),
# gerado por `vercel link` no modo repo/monorepo. Cada projeto novo = uma linha
# nova nesse arquivo. Nenhum app é hardcoded neste workflow.

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false # nunca cancela um deploy de produção no meio

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detecta apps afetados (turbo query affected ∩ .vercel/repo.json)
        id: detect
        run: |
          # Em push (não é PR), o turbo não tem uma "base" óbvia pra comparar,
          # então usamos o SHA anterior ao push (github.event.before).
          # Fallback pra HEAD^1 no caso raro de ser o primeiro push da branch.
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD^1"
          else
            BASE_REF="$BEFORE_SHA"
          fi
          echo "Base usada para comparação: $BASE_REF"

          echo "--- git diff --name-only entre $BASE_REF e HEAD ---"
          git diff --name-only "$BASE_REF" HEAD || echo "(git diff falhou — veja se $BASE_REF existe no histórico)"
          echo "-----------------------------------------------------"

          echo "--- commits entre $BASE_REF e HEAD ---"
          git log --oneline "$BASE_REF"..HEAD || echo "(git log falhou)"
          echo "HEAD resolvido para: $(git rev-parse HEAD)"
          echo "BASE_REF resolvido para: $(git rev-parse "$BASE_REF" 2>&1)"
          echo "-----------------------------------------"

          # stderr vai pra um arquivo à parte só pra debug — NUNCA misturado
          # com $RESULT, porque avisos/telemetria ali dentro quebrariam o jq.
          set +e
          RESULT=$(pnpm turbo query affected --packages --base="$BASE_REF" 2>/tmp/turbo_stderr.log)
          TURBO_EXIT=$?
          set -e

          if [ -s /tmp/turbo_stderr.log ]; then
            echo "--- stderr do turbo (avisos/erros, não afeta o parse) ---"
            cat /tmp/turbo_stderr.log
            echo "----------------------------------------------------------"
          fi

          if [ $TURBO_EXIT -ne 0 ]; then
            echo "::error::turbo query affected falhou (código $TURBO_EXIT) — veja o stderr acima"
            exit $TURBO_EXIT
          fi

          # O '?' depois de cada chave evita que o jq quebre com exit code 5
          # caso a resposta não tenha o formato esperado (ex.: data == null).
          AFFECTED_PATHS=$(echo "$RESULT" | jq -c '[.data.affectedPackages.items[]?.path]')
          echo "Pacotes afetados desde $BASE_REF: $AFFECTED_PATHS"

          MATRIX=$(jq -c --argjson affected "$AFFECTED_PATHS" \
            '[.projects[] | select(.directory as $d | ($affected | index($d)) != null)]' \
            .vercel/repo.json)
          echo "Apps a fazer deploy: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}
      max-parallel: 1 # deploys de produção um por vez
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Puxa config do projeto (ambiente production)
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN --cwd ${{ matrix.app.directory }}

      - name: Build de produção
        run: npx vercel build --prod --token=$VERCEL_TOKEN --cwd ${{ matrix.app.directory }}

      - name: Deploy prebuilt (produção)
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --cwd ${{ matrix.app.directory }}